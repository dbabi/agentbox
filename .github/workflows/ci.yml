# PLAN Defaults "amd64 testing": go test on Linux, and the BIOS install gates on the amd64 VM under KVM. It first runs
# when the repo is pushed.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # weekly, so the gates also catch drift in the Ubuntu archive
permissions:
  contents: read
jobs:
  unit:
    # the release ships linux/arm64 and linux/amd64 binaries, so the unit tests run on both
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-26.04, ubuntu-26.04-arm]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod} # caches modules and builds, keyed on go.sum
      # GitHub sets CI=true, so the tests that need these tools fail instead of skipping
      - run: sudo apt-get update && sudo apt-get install -y minisign xorriso python3-yaml qemu-utils
      # a skip fails the step unless hack/testdata/ci-skips.txt lists it, so a tool missing from the runner shows up
      - run: go vet ./... && go test -json ./... | go run ./hack/ciskips hack/testdata/ci-skips.txt
        shell: bash # bash, not the default bash -e: -o pipefail, so a failing go test fails the step
      # the unprivileged run skips the chattr tests; root has CAP_LINUX_IMMUTABLE, so here a skip is a failure
      - name: go test internal/audit as root
        run: |
          sudo env "PATH=$PATH" "GOTOOLCHAIN=$GOTOOLCHAIN" go test -count=1 -v ./internal/audit/... > audit-root.log 2>&1 || { cat audit-root.log; exit 1; }
          cat audit-root.log
          if grep -- '--- SKIP' audit-root.log; then echo 'privileged audit run skipped tests' >&2; exit 1; fi
      # a later change can run arm64 VM gates here if the arm runner has KVM
      - name: probe /dev/kvm
        if: matrix.os == 'ubuntu-26.04-arm'
        run: ls -l /dev/kvm || echo 'no /dev/kvm on this runner'
  # the ruleset requires a check named test; this one passes only if every unit leg passed
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - run: test "$RESULT" = success
        env: {RESULT: '${{ needs.unit.result }}'}
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... # 2026.2.2
      # warning and up: the info-level SC2016 hits are check strings that gate.sh and apply-gate.sh eval on purpose
      - run: shellcheck -S warning hack/*.sh install/*.sh
      # docs/STYLE.md: planning jargon, evidence outside Testing-and-Gates.md, private paths, broken relative links
      - run: hack/docs-lint.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      # §5.1: denial codes are append-only. opsgen refuses a rename locally; this catches a hand edit of the golden list
      - name: codes.golden only appends to the base branch's
        if: github.event_name == 'pull_request'
        env: {BASE: '${{ github.base_ref }}'}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          if git show FETCH_HEAD:gen/codes.golden > /tmp/base.golden 2>/dev/null; then
            head -n "$(wc -l < /tmp/base.golden)" gen/codes.golden | cmp - /tmp/base.golden
          fi
  bios:
    needs: test
    if: github.event_name != 'pull_request' # PRs get lint and test; main gets the BIOS gates too
    runs-on: ubuntu-26.04 # 24.04's swtpm 0.7 has no --ctrl terminate, which vm.sh uses
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: {mode: [none, tpm2]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils swtpm xorriso minisign libslirp-dev libglib2.0-dev pkgconf # hack/vmnet
      # vm.sh falls back to TCG with only a warning; without KVM this job must fail, not run a 70-min TCG gate
      - run: sudo chmod 666 /dev/kvm && test -w /dev/kvm
      # .vm grows to about 12 GB (stock ISO, zero-touch ISO, VM disk). It stays in the checkout: swtpm's AppArmor profile
      # lets it write only under $HOME
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc && df -h .
      # vm.sh checks it against hack/SHA256SUMS; releases.ubuntu.com drops a point release once the next one ships
      - run: |
          f=ubuntu-26.04.1-live-server-amd64.iso
          mkdir -p .vm
          curl -fsSL --retry 3 -o ".vm/$f" "https://releases.ubuntu.com/26.04.1/$f" ||
            curl -fsSL --retry 3 -o ".vm/$f" "https://old-releases.ubuntu.com/releases/26.04.1/$f"
      - run: hack/gate.sh ${{ matrix.mode }} bios
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ matrix.mode }}-bios
          retention-days: 14
          include-hidden-files: true # .vm is a dot dir; only these logs go up, never .vm/keys or .vm/id_vm
          path: |
            .vm/gate-*.txt
            .vm/gate-*.log
            .vm/install.log
            .vm/boot-*.log
