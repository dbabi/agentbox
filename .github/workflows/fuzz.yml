# PLAN milestone row 4: fuzzers for every parser. Nightly, each target fuzzes 3 h in its own job; a crash fails that job
# and uploads the crasher. Commit it to the package's testdata/fuzz/<target>/ with the fix. Each job restores the
# target's corpus from the last run and saves it again, so the nights add up toward the 24 h gate
# (docs/wiki/Testing-and-Gates.md, "The 24 h gate").
name: fuzz
on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: go test -fuzztime per target
        default: 3h
# a run that outlasts a day must not overlap the next one: that would hold twice the runners (hack TestFuzzWorkflowDay)
concurrency:
  group: fuzz
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - id: list
        run: | # the list goes to a file first: inside $() a failing fuzz-all.sh would not fail the step
          hack/fuzz-all.sh -l > "$RUNNER_TEMP/targets"
          echo "matrix=$(jq -Rnc '[inputs | split(" ") | {pkg: .[0], target: .[1]}]' < "$RUNNER_TEMP/targets")" >> "$GITHUB_OUTPUT"
  fuzz:
    needs: targets
    name: ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 200 # 3 h of fuzzing plus the build
    strategy:
      fail-fast: false
      # a Free plan runs 20 hosted jobs at once; 49 fuzz jobs would hold PR CI back for hours. ceil(targets / 8) waves of
      # FUZZTIME plus the build fit in 24 h (hack TestFuzzWorkflowDay)
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - id: corpus
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: echo "dir=$(go env GOCACHE)/fuzz/$PKG/$TARGET" >> "$GITHUB_OUTPUT"
      # each run saves under a new key (a cache entry can't be overwritten); restore takes the newest for this target
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.pkg }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.pkg }}-${{ matrix.target }}-
      - name: fuzz
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '3h' }}
          DIR: ${{ steps.corpus.outputs.dir }}
          GOMEMLIMIT: 3GiB # a standard runner has 16 GB: go test plus its 4 workers stay under it
        run: |
          echo "corpus at start: $(find "$DIR" -type f 2>/dev/null | wc -l) entries"
          go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="$FUZZTIME" "$PKG"
          echo "corpus at end: $(find "$DIR" -type f | wc -l) entries; the second line is go test's CPU time (user, sys):"
          times # not in a pipeline: a subshell has no children to count
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.pkg }}-${{ matrix.target }}-${{ github.run_id }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crasher-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/'
          if-no-files-found: ignore
