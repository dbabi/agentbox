# agentbox service users (ARCHITECTURE.md §12), installed as /usr/lib/sysusers.d/agentbox.conf. agentbox-auditd runs
# as agentbox-audit; the others are its producers, whose groups own their audit sockets (§2.1).
u agentbox       - "agentbox daemon"
u agentbox-audit - "agentbox audit daemon"
u agentbox-proxy - "agentbox egress proxy"
u agentbox-keys  - "agentbox LLM key broker"
u agentbox-git   - "agentbox git broker"
