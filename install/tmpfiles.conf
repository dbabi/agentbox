# agentbox runtime and state dirs (ARCHITECTURE.md §2.1, §9), installed as /usr/lib/tmpfiles.d/agentbox.conf. Never
# RuntimeDirectory=: systemd deletes those when the unit stops. 0711 allows traversal, not listing.
d /run/agentbox-rootd 0711 root root -
d /run/agentbox-audit 0711 agentbox-audit agentbox-audit -
d /var/lib/agentbox/audit 0750 agentbox-audit agentbox-audit -
