# agentbox runtime and state dirs (ARCHITECTURE.md §2.1, §9), installed as /usr/lib/tmpfiles.d/agentbox.conf. Never
# RuntimeDirectory=: systemd deletes those when the unit stops. 0711 allows traversal, not listing.
# Generated from internal/sockets: go test ./internal/sockets -update
d /run/agentbox 0750 root agentbox-admin -
d /run/agentbox-apps 0711 root root -
d /run/agentbox-audit 0711 agentbox-audit agentbox-audit -
d /run/agentbox-gate 0711 root root -
d /run/agentbox-gate/t 0711 root root -
d /run/agentbox-git 0711 root root -
d /run/agentbox-git/t 0711 root root -
d /run/agentbox-keys 0711 root root -
d /run/agentbox-keys/t 0711 root root -
d /run/agentbox-llm 0750 agentbox-llm agentbox-keys -
d /run/agentbox-llm-decide 0750 agentbox-llm-decide agentbox -
d /run/agentbox-proxy 0711 root root -
d /run/agentbox-proxy/t 0711 root root -
d /run/agentbox-rootd 0711 root root -
d /run/agentbox-rootd-approve 0750 root agentbox-approve -
d /run/agentbox-witness 0711 root root -
d /run/agentbox-witness/t 0711 root root -
d /var/lib/agentbox/audit 0750 agentbox-audit agentbox-audit -
d /var/lib/agentbox/control 0711 root root -
d /var/lib/agentbox/control/credstore.encrypted 0700 root root -
d /var/lib/agentbox/control/credstore.encrypted/git 0700 root root -
d /var/lib/agentbox/control/credstore.encrypted/keys 0700 root root -
d /var/lib/agentbox/keys 0700 agentbox-keys agentbox-keys -
d /var/lib/agentbox/control/secrets 0700 root root -
d /var/lib/agentbox/control/secrets/git 0700 root root -
