# agentbox service users and groups (ARCHITECTURE.md §12), installed as /usr/lib/sysusers.d/agentbox.conf. The
# firewall names them (Appendix B), so nft fails the whole load if one is missing; auditd's producer sockets are owned
# by their groups (§2.1). _ntfy comes from the ntfy package; agentbox never creates an ntfy user.
u agentbox            - "agentbox daemon"
u agentbox-audit      - "agentbox audit"
u agentbox-approve    - "agentbox approvals"
u agentbox-proxy      - "agentbox egress proxy"
u agentbox-keys       - "agentbox LLM key broker"
u agentbox-git        - "agentbox git broker"
u agentbox-llm        - "agentbox local LLM"
u agentbox-llm-decide - "agentbox local LLM (decide)"
u agentbox-ingress    - "agentbox app ingress"
g agentbox-admin      -
g agentbox-notify     -
